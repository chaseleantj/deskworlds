<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03080a" />
    <meta
      name="description"
      content="An old cherry tree in blossom on a rocky islet, in a still lake under a slowly turning sky of stars. A local, interactive preview."
    />
    <title>Cherry blossom • Deskworlds</title>
    <link rel="icon" href="../../ui/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage" aria-label="Interactive cherry tree on a lake islet at night">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="An old cherry tree in blossom leaning out from a rocky islet over a still lake, small under a sky of star trails that wheels slowly about a bright pole star. Its petals fall onto the water and drift towards you. Move the cursor and the wind blows for as long as it moves, harder the faster it goes; click the lake to drop a pebble. Space pauses. F enters fullscreen. H hides controls."
      ></canvas>
      <nav class="chrome" aria-label="Worlds">
        <a class="home-link" href="../../" aria-label="Deskworlds home">Deskworlds</a>
        <div class="world-switcher">
          <button disabled id="worlds" aria-expanded="false" aria-controls="world-list" title="Switch world">Cherry blossom</button>
          <ul id="world-list" hidden></ul>
        </div>
      </nav>
      <footer class="chrome" aria-label="World controls">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="feed">Breeze</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detail">Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">Show controls</button>
      <div id="loading" role="status"><p>Loading world…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
